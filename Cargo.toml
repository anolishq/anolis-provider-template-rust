[package]
name = "anolis-provider-template-rust"
version = "0.1.0"
edition = "2024"
# The Rust SDK's minimum: it uses let chains, stable since 1.88.
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[dependencies]
anolis-provider-sdk = { git = "https://github.com/anolishq/anolis-provider-sdk-rust", tag = "v0.1.1" }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }

[profile.release]
strip = true
